<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="用 3 到 5 個問題，依照目前最想解決的理財任務，找到適合的 88La 實體理財工具。">
  <title>88La｜找到適合的實體理財工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --orange: #c96b2f;
      --orange-dark: #9d4d1d;
      --cream: #fff3ea;
      --sand: #ead5c0;
      --paper: #fffdfb;
      --ink: #2d1a0e;
      --muted: #79513a;
      --soft: #fdf8f4;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; background: var(--soft); color: var(--ink); font-family: "Noto Sans TC", sans-serif; }
    button, a { font: inherit; }
    button:focus-visible, a:focus-visible { outline: 3px solid rgba(201,107,47,.35); outline-offset: 3px; }
    .shell { width: min(680px, calc(100% - 32px)); margin: 0 auto; }
    .site-nav { position: sticky; top: 0; z-index: 10; background: rgba(255,253,251,.94); border-bottom: 1px solid var(--sand); backdrop-filter: blur(12px); }
    .nav-inner { min-height: 58px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { color: var(--orange); font-weight: 900; letter-spacing: .08em; }
    .nav-title { color: var(--muted); font-size: 13px; }
    .hero { padding: 64px 0 34px; text-align: center; }
    .eyebrow { display: inline-block; margin-bottom: 16px; padding: 6px 11px; border: 1px solid var(--sand); border-radius: 999px; background: var(--cream); color: var(--orange); font-size: 12px; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 0 0 14px; font-size: clamp(30px, 8vw, 46px); line-height: 1.2; }
    .hero p { max-width: 520px; margin: 0 auto; color: var(--muted); font-size: 15px; line-height: 1.85; }
    .card { margin-bottom: 18px; padding: 26px; border: 1px solid var(--sand); border-radius: 18px; background: var(--white); box-shadow: 0 10px 34px rgba(90,48,21,.07); }
    .progress-row { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
    .progress-track { height: 6px; overflow: hidden; border-radius: 999px; background: var(--sand); }
    .progress-fill { width: 0; height: 100%; border-radius: inherit; background: var(--orange); transition: width .25s ease; }
    .question-label { margin: 26px 0 8px; color: var(--orange); font-size: 12px; font-weight: 700; letter-spacing: .08em; }
    h2 { margin: 0 0 10px; font-size: 24px; line-height: 1.45; }
    .question-help { margin: 0 0 22px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .options { display: grid; gap: 12px; }
    .option { width: 100%; min-height: 64px; padding: 15px 16px; border: 1.5px solid var(--sand); border-radius: 12px; background: var(--paper); color: var(--ink); text-align: left; cursor: pointer; transition: border-color .18s, background .18s, transform .18s; }
    .option:hover { border-color: var(--orange); transform: translateY(-1px); }
    .option[aria-pressed="true"] { border-color: var(--orange); background: var(--cream); box-shadow: 0 0 0 2px rgba(201,107,47,.1); }
    .option strong { display: block; margin-bottom: 4px; font-size: 15px; }
    .option span { display: block; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
    .btn { min-height: 46px; padding: 11px 20px; border: 1px solid var(--orange); border-radius: 10px; background: var(--orange); color: var(--white); font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
    .btn:hover { background: var(--orange-dark); border-color: var(--orange-dark); }
    .btn:disabled { opacity: .38; cursor: not-allowed; }
    .btn-secondary { background: transparent; color: var(--orange); }
    .btn-secondary:hover { background: var(--cream); color: var(--orange-dark); }
    .result-head { padding: 30px; border-radius: 18px; background: var(--cream); border: 1px solid var(--sand); }
    .result-head .eyebrow { background: var(--white); }
    .result-head p { margin: 0; color: var(--muted); line-height: 1.85; }
    .section-title { margin: 0 0 16px; color: var(--orange); font-size: 12px; font-weight: 700; letter-spacing: .1em; }
    .product-name { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .product-icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: var(--cream); font-size: 24px; }
    .product-name h3 { margin: 0; font-size: 19px; }
    .reason { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.85; }
    .first-step { padding: 16px; border: 1px solid var(--sand); border-radius: 10px; background: var(--soft); color: var(--ink); font-size: 14px; line-height: 1.8; }
    .alt { padding-top: 18px; border-top: 1px solid var(--sand); }
    .alt h3 { margin: 0 0 8px; font-size: 16px; }
    .why-not { margin-top: 16px; padding: 14px 16px; border-radius: 10px; background: var(--soft); color: var(--muted); font-size: 13px; line-height: 1.75; }
    .notice { margin-top: 16px; color: var(--muted); font-size: 12px; line-height: 1.75; }
    .hidden { display: none !important; }
    footer { padding: 28px 0 60px; color: var(--muted); text-align: center; font-size: 12px; line-height: 1.8; }
    @media (max-width: 520px) {
      .shell { width: min(100% - 24px, 680px); }
      .hero { padding-top: 44px; }
      .card { padding: 20px; }
      .actions { align-items: stretch; }
      .btn { flex: 1; padding-inline: 12px; }
      .nav-title { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>

<style>
/* 88La 導覽列：從社群點進來的人要回得了官網。八個資源頁共用同一份樣式與文案 */
.la-foot{width:100%;flex:0 0 100%;box-sizing:border-box;margin:36px 0 0;padding:30px 20px 34px;background:#fff3ea;border-top:1px solid #ead5c0;font-family:'Noto Sans TC',sans-serif;}
.la-foot-inner{max-width:520px;margin:0 auto;text-align:center;}
.la-foot-brand{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.12em;color:#c96b2f;}
.la-foot-text{margin:0 0 18px;font-size:13px;line-height:1.8;color:#79513a;}
.la-foot-btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;}
.la-btn{display:inline-block;padding:11px 20px;border-radius:999px;border:1px solid #c96b2f;font-size:14px;font-weight:700;line-height:1.4;text-decoration:none;transition:opacity .18s;}
.la-btn:hover{opacity:.85;}

@media print{.la-foot{display:none;}}

</style>
</head>
<body>
  <nav class="site-nav" aria-label="測驗導覽">
    <div class="shell nav-inner">
      <span class="brand"><a class="la-brand-link" data-la-cta="home" href="https://88la-site.vercel.app/?utm_source=resource&amp;utm_medium=brand&amp;utm_campaign=savings-bag-quiz">88La</a></span>
      <span class="nav-title">找到適合的實體理財工具</span>
      <a href="/savings-bag" style="color:var(--orange);font-size:13px;">看全部工具</a>
    </div>
  </nav>

  <header class="hero shell">
    <span class="eyebrow">88La 免費測驗</span>
    <h1>你現在最需要<br>哪一種理財工具？</h1>
    <p>先從想解決的事情開始，不用先判斷自己是哪種理財程度。全程 3 到 5 題，結果只給一個第一推薦。</p>
  </header>

  <main class="shell">
    <section id="quiz" class="card" aria-live="polite">
      <div class="progress-row"><span id="progressText">第 1 題</span><span id="progressPercent">0%</span></div>
      <div class="progress-track" aria-hidden="true"><div id="progressFill" class="progress-fill"></div></div>
      <p id="questionLabel" class="question-label"></p>
      <h2 id="questionTitle"></h2>
      <p id="questionHelp" class="question-help"></p>
      <div id="options" class="options" role="group" aria-labelledby="questionTitle"></div>
      <div class="actions">
        <button id="backBtn" class="btn btn-secondary" type="button">回上一題</button>
        <button id="nextBtn" class="btn" type="button" disabled>下一題</button>
      </div>
    </section>

    <section id="result" class="hidden" aria-live="polite">
      <div class="result-head" style="margin-bottom:18px;">
        <span class="eyebrow">你的第一步</span>
        <h2 id="resultTitle"></h2>
        <p id="resultSummary"></p>
      </div>

      <div class="card">
        <p class="section-title">第一推薦</p>
        <div class="product-name">
          <div id="primaryIcon" class="product-icon"></div>
          <h3 id="primaryName"></h3>
        </div>
        <p id="primaryReason" class="reason"></p>
        <div id="firstStep" class="first-step"></div>
        <div class="actions" style="justify-content:flex-start;flex-wrap:wrap;">
          <a id="primaryLink" class="btn" href="#">查看工具</a>
          <button id="restartBtn" class="btn btn-secondary" type="button">重新測驗</button>
        </div>
        <p id="dataNotice" class="notice"></p>
      </div>

      <div id="emergencyCard" class="card hidden">
        <p class="section-title">先調整開始順序</p>
        <p id="emergencyText" class="reason" style="margin-bottom:14px;"></p>
        <a class="btn btn-secondary" href="/resources/emergency-fund-quiz/index.html">先算緊急預備金</a>
      </div>

      <div id="alternativeCard" class="card alt">
        <p class="section-title">另一個可能適合的方式</p>
        <h3 id="alternativeName"></h3>
        <p id="alternativeReason" class="reason"></p>
        <div id="whyNot" class="why-not"></div>
      </div>
    </section>
  </main>

  <footer class="shell">本測驗只協助你整理使用情境，不構成個人化財務建議。<br>Instagram：@every_dollars</footer>

  <script>
    const APP_NAME = "88La財務導航";
    const STORE_FALLBACK = "https://myship.7-11.com.tw/general/detail/GM2510287339100";

    const PRODUCTS = {
      daily_budget: {
        icon: "📅", name: "每日預算記錄組", url: STORE_FALLBACK,
        reason: "它處理的是高頻日常支出，不需要逐筆回想買了什麼。每天先決定可用預算，回家看剩餘現金，就能知道今天花了多少。",
        firstStep: "先選一個最常超支的項目，例如餐費。明天出門前只帶這個項目的固定預算，晚上記下剩餘金額。"
      },
      spending_tracker: {
        icon: "📊", name: "2026 極簡收支分配表", url: STORE_FALLBACK,
        reason: "它先處理整個月的分配，讓收入、固定支出、變動支出與儲蓄各自有位置。",
        firstStep: "發薪日先填入本月收入，再依序列出固定支出，最後分配變動支出與儲蓄。"
      },
      dream_fund: {
        icon: "💭", name: "夢想變現儲蓄套組", url: STORE_FALLBACK,
        reason: "它適合已有目標的人，把目標金額與期限回推成每月要完成的金額，並記錄每月實際進度。",
        firstStep: "寫下目標金額與希望完成的月份，再用目標金額除以剩餘月數，得到每月儲蓄目標。"
      },
      world_advance: {
        icon: "🌍", name: "環遊世界存錢袋進階版", url: STORE_FALLBACK,
        reason: "每張都有國家風景與目的地意象，適合需要靠畫面維持旅遊目標感的人。",
        firstStep: "先選最想去的目的地，再估算旅程總預算與準備月數。"
      },
      world_challenge: {
        icon: "✈️", name: "環遊世界挑戰卡", url: STORE_FALLBACK,
        reason: "你可以自己填入目的地、預計出發時間與需要的金額，再回推每期要存多少。",
        firstStep: "在封面機票寫下目的地、預計出發月份與旅遊預算。"
      },
      game_challenge: {
        icon: "🎮", name: "闖關打怪遊戲存錢袋", url: STORE_FALLBACK,
        reason: "你現在不缺一個很大的目標，先用闖關與完成感建立存錢習慣，開始阻力比較低。",
        firstStep: "先完成第一關，不用一次設定很大的金額。連續完成三關後，再決定要不要提高難度。"
      },
      red_packet: {
        icon: "🧧", name: "紅包預存備戰卡", url: STORE_FALLBACK,
        reason: "它把明年會發生的紅包支出提早拆開準備，避免過年前一次拿出大筆金額。",
        firstStep: "先選擇紅包總預算，再除以距離過年的剩餘月數。"
      },
      christmas: {
        icon: "🎄", name: "聖誕節限定存錢袋", url: STORE_FALLBACK,
        reason: "它讓交換禮物、聚會或送給自己的禮物有獨立預算，不用到十二月才臨時挪錢。",
        firstStep: "先決定今年的聖誕總預算，再拆成每月固定預存金額。"
      },
      app: {
        icon: "📱", name: APP_NAME, url: "/app",
        reason: "你平常幾乎都用數位支付，實體現金反推的阻力會比較高。先用數位工具整理預算、帳戶與付款紀錄會更貼近習慣。",
        firstStep: "先看完整使用週期，確認月初分配、平常記錄與月底診斷是否符合你的需求。"
      }
    };

    const QUESTIONS = {
      need: {
        label: "先選理財任務", title: "你現在最想先處理哪一件事？", help: "這一題決定工具家族，後面的回答只會調整適用方式，不會推翻你的主要需求。",
        options: [
          ["daily", "日常開銷常超過，但我不想逐筆記帳", "先控制餐費、飲料或高頻小額支出"],
          ["allocate", "我想在月初先把整個月分配好", "整理收入、固定支出、變動支出與儲蓄"],
          ["goal", "我有一個明確的非旅遊目標", "想把金額與期限拆成每月行動"],
          ["travel", "我想存旅遊基金", "需要一個能維持目的地動力的工具"],
          ["habit", "我還沒有特定目標，只想先養成習慣", "希望用低壓方式累積第一筆存款"],
          ["annual", "我想為年度大筆支出預存", "例如紅包、聖誕節或其他已知支出"]
        ]
      },
      goalDetail: {
        label: "確認目標狀態", title: "你的目標目前有多清楚？", help: "不論選哪個答案，工具家族不會改變，只會調整第一步。",
        options: [
          ["clear", "目標、金額與期限都很清楚", "可以直接回推每月要存多少"],
          ["partial", "只有大概目標，金額或期限還不確定", "需要先把目標補完整"]
        ]
      },
      travelDetail: {
        label: "選擇旅遊方式", title: "哪種畫面更能讓你持續？", help: "兩款都處理旅遊基金，差別在目的地由商品提供，或由你自行設定。",
        options: [
          ["scenery", "每張都有國家風景與目的地感", "想靠畫面維持期待"],
          ["custom", "我想自己填目的地、日期與金額", "希望每次旅程都能自訂"]
        ]
      },
      annualDetail: {
        label: "確認預存項目", title: "這筆年度支出主要是什麼？", help: "季節限定商品若未販售，結果仍會提供通用的月初預存方式。",
        options: [
          ["red", "過年紅包", "提早準備明年的紅包支出"],
          ["christmas", "聖誕節與交換禮物", "先安排送禮與聚會預算"],
          ["other", "其他已知的大筆支出", "例如保費、稅金或年度費用"]
        ]
      },
      payment: {
        label: "確認使用方式", title: "你平常主要怎麼付款？", help: "這題用來排除使用阻力太高的工具。",
        options: [
          ["cash", "以現金為主", "實體分配最直接"],
          ["mixed", "現金與數位支付都有", "可依項目選擇使用方式"],
          ["digital", "幾乎都是信用卡或行動支付", "數位整理比較符合習慣"]
        ]
      },
      rhythm: {
        label: "確認整理節奏", title: "你最能持續的整理頻率是？", help: "沒有最好頻率，只選最符合你現在生活的答案。",
        options: [
          ["daily", "每天花一分鐘", "願意做很短的每日動作"],
          ["weekly", "一週整理一次", "平常先保留紀錄，週末再看"],
          ["monthly", "發薪日或每月整理一次", "適合做整月分配"],
          ["low", "我希望越少操作越好", "需要降低日常輸入阻力"]
        ]
      },
      emergency: {
        label: "調整開始順序", title: "目前有準備緊急預備金嗎？", help: "這題不會換掉商品，只會調整你拿到工具後的第一個目標。",
        options: [
          ["none", "還沒有", "先建立第一筆預備金"],
          ["some", "有一些，但不到三個月生活費", "繼續補足目前缺口"],
          ["ready", "已有三個月以上生活費", "可依原本目標開始"]
        ]
      }
    };

    const state = { answers: {}, step: 0, sequence: ["need"] };
    const quiz = document.getElementById("quiz");
    const result = document.getElementById("result");
    const progressText = document.getElementById("progressText");
    const progressPercent = document.getElementById("progressPercent");
    const progressFill = document.getElementById("progressFill");
    const questionLabel = document.getElementById("questionLabel");
    const questionTitle = document.getElementById("questionTitle");
    const questionHelp = document.getElementById("questionHelp");
    const options = document.getElementById("options");
    const backBtn = document.getElementById("backBtn");
    const nextBtn = document.getElementById("nextBtn");

    function safeStoreUrl(value, fallback) {
      try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol) ? url.href : fallback;
      } catch {
        return fallback;
      }
    }

    async function loadProductCatalog() {
      try {
        const response = await fetch("/api/site-content?key=savingsBagQuiz");
        if (!response.ok) return;
        const payload = await response.json();
        const value = payload && payload.value;
        const catalog = { ...(value && value.products), ...(value && value.seasonal) };
        Object.entries(catalog).forEach(([key, item]) => {
          if (!PRODUCTS[key] || !item) return;
          if (typeof item.name === "string" && item.name.trim()) PRODUCTS[key].name = item.name.trim();
          if (typeof item.icon === "string" && item.icon.trim()) PRODUCTS[key].icon = item.icon.trim();
          PRODUCTS[key].url = safeStoreUrl(item.url, PRODUCTS[key].url);
        });
      } catch {
        // 公開內容載入失敗時保留已驗證的預設資料，不阻擋測驗。
      }
    }

    function buildSequence() {
      const need = state.answers.need;
      const branch = need === "goal" ? ["goalDetail"] : need === "travel" ? ["travelDetail"] : need === "annual" ? ["annualDetail"] : [];
      const rhythm = ["daily", "allocate"].includes(need) ? ["rhythm"] : [];
      state.sequence = ["need", ...branch, "payment", ...rhythm, "emergency"];
    }

    function renderQuestion() {
      buildSequence();
      const key = state.sequence[state.step];
      const q = QUESTIONS[key];
      const progress = Math.round((state.step / state.sequence.length) * 100);
      progressText.textContent = `第 ${state.step + 1} 題，共 ${state.sequence.length} 題`;
      progressPercent.textContent = `${progress}%`;
      progressFill.style.width = `${progress}%`;
      questionLabel.textContent = q.label;
      questionTitle.textContent = q.title;
      questionHelp.textContent = q.help;
      options.innerHTML = "";
      q.options.forEach(([value, title, desc]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option";
        button.setAttribute("aria-pressed", state.answers[key] === value ? "true" : "false");
        const strong = document.createElement("strong");
        strong.textContent = title;
        const span = document.createElement("span");
        span.textContent = desc;
        button.append(strong, span);
        button.addEventListener("click", () => {
          state.answers[key] = value;
          options.querySelectorAll(".option").forEach(item => item.setAttribute("aria-pressed", "false"));
          button.setAttribute("aria-pressed", "true");
          nextBtn.disabled = false;
        });
        options.appendChild(button);
      });
      backBtn.textContent = state.step === 0 ? "回官網" : "回上一題";
      nextBtn.textContent = state.step === state.sequence.length - 1 ? "查看結果" : "下一題";
      nextBtn.disabled = !state.answers[key];
    }

    function chooseProducts() {
      const a = state.answers;
      let primary;
      let alternative;
      let whyNot;
      if (a.need === "daily") {
        primary = a.payment === "digital" || a.rhythm === "low" ? "app" : "daily_budget";
        alternative = primary === "app" ? "daily_budget" : "spending_tracker";
        whyNot = primary === "app"
          ? "每日預算記錄組的核心是用剩餘現金反推花費，你幾乎都用數位支付，執行阻力會比較高。"
          : "你目前最主要的卡點是日常花費，不是整個月不知道怎麼分，所以先處理每天的支出。";
      } else if (a.need === "allocate") {
        primary = a.payment === "digital" && a.rhythm === "low" ? "app" : "spending_tracker";
        alternative = primary === "app" ? "spending_tracker" : "daily_budget";
        whyNot = primary === "app"
          ? "極簡收支分配表需要主動整理，你希望操作越少，先用數位工具比較符合目前節奏。"
          : "每日預算只處理高頻日常支出，你現在要先處理的是整個月的收入分配。";
      } else if (a.need === "goal") {
        primary = "dream_fund"; alternative = "game_challenge";
        whyNot = "闖關打怪比較適合還沒有特定目標的人，你已經有方向，先把金額與期限拆清楚更有幫助。";
      } else if (a.need === "travel") {
        primary = a.travelDetail === "custom" ? "world_challenge" : "world_advance";
        alternative = primary === "world_challenge" ? "world_advance" : "world_challenge";
        whyNot = primary === "world_challenge"
          ? "進階版的國家風景已經設定好，你更需要能自行填寫目的地、日期與金額的版本。"
          : "挑戰卡重點是自行設定，你目前更在意既有國家風景帶來的目的地感。";
      } else if (a.need === "habit") {
        primary = "game_challenge"; alternative = "dream_fund";
        whyNot = "夢想變現需要明確目標與期限，你現在先建立持續存錢的成功感就好。";
      } else if (a.annualDetail === "red") {
        primary = "red_packet"; alternative = "spending_tracker";
        whyNot = "極簡收支分配表能做通用預存，但紅包備戰卡更直接對應你這次的支出情境。";
      } else if (a.annualDetail === "christmas") {
        primary = "christmas"; alternative = "spending_tracker";
        whyNot = "極簡收支分配表能做通用預存，但聖誕限定款更直接對應送禮與聚會預算。";
      } else {
        primary = "spending_tracker"; alternative = "dream_fund";
        whyNot = "夢想變現比較適合單一目標，你目前是要處理每年固定發生的大筆支出。";
      }
      return { primary, alternative, whyNot };
    }

    function showResult() {
      window.laTrackOnce && window.laTrackOnce("tool_complete");
      const choice = chooseProducts();
      const primary = PRODUCTS[choice.primary];
      const alternative = PRODUCTS[choice.alternative];
      document.getElementById("resultTitle").textContent = `你現在最需要的是：${primary.name}`;
      document.getElementById("resultSummary").textContent = "推薦先處理目前最明確的任務，再決定要不要加入第二種工具。";
      document.getElementById("primaryIcon").textContent = primary.icon;
      document.getElementById("primaryName").textContent = primary.name;
      document.getElementById("primaryReason").textContent = primary.reason;
      let firstStep = primary.firstStep;
      if (state.answers.goalDetail === "partial") firstStep = "先補上目標金額與希望完成的月份，再開始回推每月儲蓄額。";
      document.getElementById("firstStep").textContent = `拿到後第一個動作：${firstStep}`;
      const primaryLink = document.getElementById("primaryLink");
      primaryLink.href = primary.url;
      primaryLink.textContent = choice.primary === "app" ? `查看${APP_NAME}` : `查看「${primary.name}」`;
      if (/^https?:/.test(primary.url)) {
        primaryLink.target = "_blank";
        primaryLink.rel = "noopener noreferrer";
      } else {
        primaryLink.removeAttribute("target");
        primaryLink.removeAttribute("rel");
      }
      document.getElementById("dataNotice").textContent = choice.primary === "app"
        ? `${APP_NAME}方案與販售狀態以官網頁面為準。`
        : "商品販售狀態與售價以賣場頁面為準。";
      document.getElementById("alternativeName").textContent = alternative.name;
      document.getElementById("alternativeReason").textContent = alternative.reason;
      document.getElementById("whyNot").textContent = `為什麼不是先選另一款？${choice.whyNot}`;
      const emergencyCard = document.getElementById("emergencyCard");
      if (state.answers.emergency !== "ready") {
        emergencyCard.classList.remove("hidden");
        document.getElementById("emergencyText").textContent = state.answers.emergency === "none"
          ? "你仍然可以使用這款工具，但第一個目標先寫成緊急預備金，先從能持續的小額開始。"
          : "你已經有一部分緊急預備金，建議先把目前缺口補足，再切換到下一個目標。";
      } else {
        emergencyCard.classList.add("hidden");
      }
      quiz.classList.add("hidden");
      result.classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    backBtn.addEventListener("click", () => {
      if (state.step === 0) {
        window.location.href = "/savings-bag";
        return;
      }
      state.step -= 1;
      renderQuestion();
    });

    nextBtn.addEventListener("click", () => {
      buildSequence();
      if (state.step >= state.sequence.length - 1) {
        progressFill.style.width = "100%";
        progressPercent.textContent = "100%";
        showResult();
        return;
      }
      state.step += 1;
      renderQuestion();
      window.scrollTo({ top: quiz.offsetTop - 74, behavior: "smooth" });
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
      state.answers = {};
      state.step = 0;
      state.sequence = ["need"];
      result.classList.add("hidden");
      quiz.classList.remove("hidden");
      renderQuestion();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });

    loadProductCatalog();
    renderQuestion();
  </script>
